name = "bookghost-2"
main = "src/index.ts"
compatibility_date = "2026-10-22"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/telegram/webhook"]

[[d1_databases]]
binding = "DB"
database_name = "bookghost-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
TIMEZONE = "Europe/Kyiv"
WEBAPP_URL = "https://replace-after-deploy.example"
